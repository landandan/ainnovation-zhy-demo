server {
    listen 80;
    server_name localhost;

    # 1. 代理前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        try_files $uri $uri.html $uri/ /index.html; 
    }

    # 2. 反向代理 Flask 后端 API
    location /api/ {
        proxy_pass http://backend:5000/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持（后续 Dify 代理可能需要）
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 3. 反向代理 Dify 的 API 请求（前端直连 Dify）
    # 注意：Mock 模式下前端直连 Dify API，不经过此代理。
    # 如果需要 nginx 代理 Dify，请修改 proxy_pass 为实际 Dify 地址。
    location /v1/ {
        # 默认代理到宿主机 80 端口（可按需修改为 Dify 实际地址）
        # 例如：proxy_pass http://192.168.1.100:18810/v1/;
        proxy_pass http://host.docker.internal:80/v1/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 保留原始 Authorization 头（Dify API Key）
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

name: Cleanup Release Assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"


jobs:
  cleanup:

    runs-on: ubuntu-latest

    env:
      KEEP_RELEASES: 3


    steps:

      - name: Cleanup old release assets

        env:
          GITEA_URL: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.PAT_TOKEN }}

        shell: bash

        run: |

          set -u


          echo "================================"
          echo " Gitea Release Asset Cleanup"
          echo "================================"

          echo "Gitea : ${GITEA_URL}"
          echo "Repo  : ${REPO}"
          echo "Keep  : ${KEEP_RELEASES}"
          echo



          ###################################
          # 检查 Token
          ###################################

          if [ -z "${GITEA_TOKEN}" ]; then

              echo "ERROR: GITEA_TOKEN missing"

              exit 1

          fi



          ###################################
          # 测试 Token
          ###################################

          echo "Checking token..."


          user=$(curl -s \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_URL}/api/v1/user")


          echo "${user}" | jq .


          if echo "${user}" | jq -e '.message' >/dev/null

          then

              echo "Token invalid"

              exit 1

          fi



          ###################################
          # 获取 Release
          ###################################

          echo
          echo "Fetching releases..."


          releases=$(curl -s \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_URL}/api/v1/repos/${REPO}/releases?limit=100")



          echo "${releases}" | jq .



          count=$(echo "${releases}" | jq length)



          echo

          echo "Release count: ${count}"



          if [ "${count}" -le "${KEEP_RELEASES}" ]

          then

              echo "Nothing to cleanup"

              exit 0

          fi




          ###################################
          # 获取需要清理的 Release ID
          ###################################

          old_release_ids=$(echo "${releases}" \
            | jq -r ".[$KEEP_RELEASES:][] | .id")



          ###################################
          # 循环删除附件
          ###################################


          for release_id in ${old_release_ids}

          do

              echo
              echo "================================"
              echo "Release ID: ${release_id}"
              echo "================================"



              assets=$(curl -s \
                -H "Authorization: token ${GITEA_TOKEN}" \
                "${GITEA_URL}/api/v1/repos/${REPO}/releases/${release_id}/assets")



              echo "${assets}" | jq .



              asset_count=$(echo "${assets}" | jq length)



              if [ "${asset_count}" -eq 0 ]

              then

                  echo "No assets"

                  continue

              fi



              echo "Asset count: ${asset_count}"




              echo "${assets}" \
              | jq -r '.[] | "\(.id)|\(.name)"' \
              | while IFS="|" read asset_id asset_name


              do


                  echo
                  echo "Deleting asset:"
                  echo " id   = ${asset_id}"
                  echo " name = ${asset_name}"



                  response=$(curl \
                    -s \
                    -w "\nHTTP_CODE:%{http_code}" \
                    -X DELETE \
                    -H "Authorization: token ${GITEA_TOKEN}" \
                    "${GITEA_URL}/api/v1/repos/${REPO}/releases/assets/${asset_id}")



                  echo "${response}"



                  http_code=$(echo "${response}" \
                    | grep HTTP_CODE \
                    | cut -d ":" -f2)



                  if [ "${http_code}" = "204" ]

                  then

                      echo "DELETE SUCCESS"


                  else

                      echo "DELETE FAILED"

                  fi



              done



          done



          echo
          echo "================================"
          echo "Cleanup finished"
          echo "================================"
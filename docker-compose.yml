version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "9527:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///data/cnooc.db
      - AUTH_PROVIDER=local
    volumes:
      - ./data:/app/data
      - ./backend/.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
